name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/rust.yml

  # SonarCloud with the coverage of the Rust tests (krizaka-internal#3553): cargo-llvm-cov writes lcov.info, sonar.rust.lcov.reportPaths reads it.
  sonar:
    name: SonarCloud
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # blame and new-code detection need the history
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      # CI analysis: the SonarCloud app still decorates the pull request. On a pull request only the quality gate's verdict is advisory
      # here (the same rule as the shared python-ci workflow, rules review of 2026-11-05); elsewhere the gate fails the job.
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

  film:
    name: film tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test film/test/*.test.mjs
      # The action as a caller uses it: its `dir` output must point at the scripts (an empty one sent callers to /film).
      - uses: ./.github/actions/film
        id: film
      - name: the action's dir output holds the film scripts
        env:
          FILM_DIR: ${{ steps.film.outputs.dir }}
        run: test -n "$FILM_DIR" && test -f "$FILM_DIR/film.mjs" && test -f "$FILM_DIR/join-cli.mjs" || { echo "dir output is '$FILM_DIR'"; exit 1; }

  # The one check main requires (org profile: « CI gate »); it always reports and fails when a leg failed or was skipped.
  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [ci, film, sonar]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every leg succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do [ "$r" = success ] || { echo "a leg ended $r"; exit 1; }; done
