# The SonarCloud project predates the repository's rename: its key is krizaka-desktop (sonar-ratchet.json names another key).
sonar.projectKey=krizaka_krizaka-desktop
sonar.organization=krizaka
sonar.sources=src,plugin/src
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.exclusions=**/target/**,film/**

# The report of `cargo llvm-cov --workspace --lcov` (ci.yml, job sonar). Without this key the scanner never reads it and the
# project shows no coverage measure (krizaka-internal#3553).
sonar.rust.lcov.reportPaths=lcov.info

# Not runtime code, so not measured for coverage: the plugin's build script (it only writes the generated permissions).
sonar.coverage.exclusions=plugin/build.rs
